name: UE5 Android APK Playtest

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: Build configuration
        required: true
        type: choice
        options:
          - Development
          - Shipping
        default: Development

permissions:
  contents: read

jobs:
  github-preflight:
    name: Validate UE5 project on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Unreal project descriptor and Android settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("Unreal")
          project = root / "VietNamHanhTrinh.uproject"
          target = root / "Source" / "VietNamHanhTrinh.Target.cs"
          module = root / "Source" / "VietNamHanhTrinh" / "VietNamHanhTrinh.Build.cs"
          engine = root / "Config" / "DefaultEngine.ini"

          required = [project, target, module, engine]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required UE project files: " + ", ".join(missing))

          data = json.loads(project.read_text(encoding="utf-8"))
          if data.get("EngineAssociation") != "5.8":
              raise SystemExit("Project EngineAssociation must be 5.8")
          modules = data.get("Modules", [])
          if not any(item.get("Name") == "VietNamHanhTrinh" for item in modules):
              raise SystemExit("VietNamHanhTrinh runtime module is not declared")

          target_text = target.read_text(encoding="utf-8")
          module_text = module.read_text(encoding="utf-8")
          config_text = engine.read_text(encoding="utf-8")
          checks = {
              "Game target": "TargetType.Game" in target_text,
              "UE 5.8 include order": "Unreal5_8" in target_text,
              "runtime module": "VietNamHanhTrinh" in module_text,
              "Android ARM64": "bBuildForArm64=True" in config_text,
              "Android package id": "PackageName=com.bovietnam.hanhtrinh" in config_text,
              "iOS bundle id": "BundleIdentifier=com.bovietnam.hanhtrinh" in config_text,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + name)
          if failed:
              raise SystemExit("Project preflight failed: " + ", ".join(failed))

          print("UE5.8 project preflight passed. This is a source/configuration check, not an Unreal compilation.")
          PY

  android-apk:
    name: Package Android ARM64 APK with UE 5.8
    needs: github-preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      UE_ROOT: ${{ vars.UE_ROOT }}
      BUILD_CONFIG: ${{ inputs.build_config }}
      PROJECT_FILE: ${{ github.workspace }}\Unreal\VietNamHanhTrinh.uproject
      ARCHIVE_DIR: ${{ github.workspace }}\dist\UnrealAndroid
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Unreal toolchain
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UE_ROOT)) { throw "Set repository variable UE_ROOT to the UE 5.8 install directory." }
          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          if (!(Test-Path $uat)) { throw "RunUAT.bat not found: $uat" }
          if (!(Test-Path $env:PROJECT_FILE)) { throw "Project file not found: $env:PROJECT_FILE" }
          Write-Host "Using Unreal Engine at $env:UE_ROOT"

      - name: Package Android ARM64 APK
        shell: pwsh
        run: |
          $uat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          New-Item -ItemType Directory -Force -Path $env:ARCHIVE_DIR | Out-Null
          & $uat BuildCookRun `
            "-project=$env:PROJECT_FILE" `
            -noP4 `
            -platform=Android `
            -cookflavor=ASTC `
            "-clientconfig=$env:BUILD_CONFIG" `
            -build -cook -stage -pak -archive `
            "-archivedirectory=$env:ARCHIVE_DIR" `
            -utf8output
          if ($LASTEXITCODE -ne 0) { throw "BuildCookRun failed: $LASTEXITCODE" }

      - name: Verify and name APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path $env:ARCHIVE_DIR -Filter *.apk -Recurse | Select-Object -First 1
          if ($null -eq $apk) { throw "No APK found in $env:ARCHIVE_DIR" }
          $destination = Join-Path "${{ github.workspace }}\dist" "VietNamHanhTrinh-Android-ARM64-$env:BUILD_CONFIG.apk"
          Copy-Item $apk.FullName $destination -Force
          $size = (Get-Item $destination).Length
          if ($size -lt 1000000) { throw "APK is unexpectedly small ($size bytes)." }
          Write-Host "Verified APK: $destination ($size bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietNamHanhTrinh-Android-ARM64-${{ inputs.build_config }}
          path: ${{ github.workspace }}/dist/*.apk
          if-no-files-found: error
          retention-days: 14
