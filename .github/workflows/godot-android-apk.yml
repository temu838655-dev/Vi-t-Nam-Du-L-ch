name: Godot Android APK

on:
  push:
    branches: [godot4-port]
    paths:
      - "Godot/**"
      - ".github/workflows/godot-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          test -f Godot/project.godot
          test -f Godot/scenes/main.tscn
          test -f Godot/scripts/main.gd
          test -f Godot/scripts/player.gd
          test -f Godot/scripts/mobile_hud.gd
          test -f Godot/scripts/game_state.gd
          test -f Godot/scripts/interactable_npc.gd
          test -f Godot/export_presets.cfg
          grep -q 'config/name="Việt Nam' Godot/project.godot
          echo "Godot project structure validated"

  android-apk:
    name: Export Android ARM64 APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure preinstalled Android SDK
        run: |
          set -eux
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -s "$SDK_ROOT/platform-tools/adb"
      - name: Download Godot 4.4.1 and Android export templates
        run: |
          set -eux
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable" /tmp/godot-templates
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot-templates/godot.zip
          unzip -q /tmp/godot-templates/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v4.4.1-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          cp -a /tmp/godot-templates/unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          "$GODOT_BIN" --version
      - name: Configure Godot Android signing
        run: |
          set -eux
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -s "$ANDROID_HOME/platform-tools/adb"
          test -s "$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/platforms/android-34"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Import and validate Godot project
        run: |
          godot --headless --path Godot --editor --quit --verbose
          godot --headless --path Godot --quit-after 3 --verbose
      - name: Export Android ARM64 APK
        run: |
          mkdir -p Godot/build
          godot --headless --path Godot --export-debug "Android" build/VietNamHanhTrinh-Android-ARM64.apk --verbose
      - name: Verify APK
        run: |
          test -s Godot/build/VietNamHanhTrinh-Android-ARM64.apk
          file Godot/build/VietNamHanhTrinh-Android-ARM64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietNamHanhTrinh-Godot-Android-ARM64
          path: Godot/build/VietNamHanhTrinh-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
