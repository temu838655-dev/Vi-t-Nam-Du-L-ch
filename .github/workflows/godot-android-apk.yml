name: Godot Android APK

on:
  push:
    branches: [godot4-port]
    paths:
      - "Godot/**"
      - ".github/workflows/godot-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          test -f Godot/project.godot
          test -f Godot/scenes/main.tscn
          test -f Godot/scripts/main.gd
          test -f Godot/scripts/player.gd
          test -f Godot/scripts/mobile_hud.gd
          test -f Godot/scripts/game_state.gd
          test -f Godot/scripts/interactable_npc.gd
          test -f Godot/export_presets.cfg
          grep -q 'config/name="Việt Nam' Godot/project.godot
          echo "Godot project structure validated"

  android-apk:
    name: Export Android ARM64 APK
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot Android export templates
        run: |
          set -eux
          GODOT_VERSION="$(godot --version | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          cp -a /tmp/godot-templates/unpacked/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
      - name: Install Android SDK packages and configure signing
        run: |
          set -eux
          JAVA_BIN="$(command -v javac)"
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          mkdir -p "$SDK_PATH" "$HOME/.android" "$HOME/.config/godot"
          SDKMANAGER="$(find "$SDK_PATH" /opt /usr/local -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found in the runner image"
            find "$SDK_PATH" -maxdepth 4 -type d | head -n 80
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Using Android SDK: $SDK_PATH"
          echo "Using Java: $JAVA_HOME_PATH"
          ls -la "$SDK_PATH/platforms" "$SDK_PATH/build-tools"
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Verify Godot project
        run: |
          godot --version
          godot --headless --path Godot --editor --quit
      - name: Export APK
        run: |
          mkdir -p build
          cd Godot
          godot --headless --path . --export-debug "Android" ../build/VietNamHanhTrinh-Android-ARM64.apk
      - name: Verify APK
        run: |
          test -s build/VietNamHanhTrinh-Android-ARM64.apk
          file build/VietNamHanhTrinh-Android-ARM64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VietNamHanhTrinh-Godot-Android-ARM64
          path: build/VietNamHanhTrinh-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
