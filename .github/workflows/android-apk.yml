name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in preinstalled Android SDK"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Verify prebuilt Android templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          echo "Godot Android export templates are installed."
      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/VietNam-HanhTrinh-BatTan.apk
          test -s build/VietNam-HanhTrinh-BatTan.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietNam-HanhTrinh-BatTan-Godot-Prototype-APK
          path: build/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          generate_release_notes: true
